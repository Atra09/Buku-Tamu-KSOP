server {
    listen 80 ssl default_server;
    listen 443 ssl;
    server_name _;

    # Sembunyikan versi Nginx agar tidak mudah di-scan
    server_tokens off;

    # SSL Certificate Configuration dari folder /ssl
    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Auto-redirect plain HTTP requests ke HTTPS
    error_page 497 https://$http_host$request_uri;

    # Security Headers Tambahan
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Client upload file size limit (webcam foto tamu)
    client_max_body_size 50M;

    # 1. Serve Frontend Build (React SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri /index.html;
    }

    # Assets serving
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 2. Reverse Proxy API requests ke Backend
    location /api/ {
        proxy_pass http://node_tamuB-1:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;

        # Teruskan IP asli pengunjung dari Cloudflare
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Serve uploaded guest photos dari backend
    location /uploads/ {
        proxy_pass http://node_tamuB-1:3002/uploads/;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Content-Type-Options "nosniff";
    }

    # 4. Serve profil foto jika ada
    location /profil/ {
        proxy_pass http://node_tamuB-1:3002/profil/;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Error page handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
