server {
    listen 80 ssl default_server;
    listen 443 ssl;
    server_name _;

    # SSL Certificate Configuration
    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Auto-redirect plain HTTP requests to HTTPS on the same port!
    error_page 497 https://$host:$server_port$request_uri;

    # Client upload file size limit (for guest webcam photo uploads)
    client_max_body_size 50M;

    # 1. Serve Frontend Build (React SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri /index.html;
    }

    # Assets caching/serving
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # 2. Reverse Proxy API Requests to Node.js / Express Backend (Host IP / Gateway)
    location /api/ {
        proxy_pass http://172.17.0.1:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Serve Uploaded Guest Photos from Backend Public Uploads Folder (Host IP / Gateway)
    location /uploads/ {
        proxy_pass http://172.17.0.1:3002/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Error Page Handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
